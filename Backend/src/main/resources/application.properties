spring.config.import=optional:application-secret.properties
spring.application.name=backend

# Server port
server.port=${PORT:8080}

# MySQL database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/hotelmanagement}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=always

# Gmail SMTP (optional until email features are configured)
# Brevo SMTP email configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Sender details
app.mail.from=${BREVO_FROM_EMAIL}
app.mail.from-name=${BREVO_FROM_NAME:Hotel Management}